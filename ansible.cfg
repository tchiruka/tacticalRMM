[defaults]
inventory = inventory/hosts.yml
roles_path = roles:.galaxy/roles
collections_path = .galaxy/collections
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
forks = 5
gathering = smart
callback_result_format = yaml
# Vault password: export ANSIBLE_VAULT_PASSWORD_FILE=~/.config/trmm/vault-pass
# (never stored in this repository)

[privilege_escalation]
become = False

[ssh_connection]
# Pipelining is required so that `become_user: tactical` (an unprivileged
# user) works without world-readable temp files.
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o ServerAliveCountMax=10
