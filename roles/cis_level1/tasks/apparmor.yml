---
# The vendor task for 1.3.1.3 runs `aa-enforce /etc/apparmor.d/*`, which also
# flips Ubuntu's `flags=(unconfined)` user-namespace profiles into enforce
# mode. Narrower: enforce every profile that is in COMPLAIN mode, leave the
# deliberately unconfined profiles as Ubuntu ships them (EXC-05).

- name: AppArmor | Find profiles shipped in complain mode
  ansible.builtin.command: grep -lE 'flags=\([^)]*complain' -r /etc/apparmor.d --exclude-dir=abstractions --exclude-dir=tunables --exclude-dir=local
  changed_when: false
  failed_when: cis_level1_aa_complain.rc not in [0, 1]
  check_mode: false
  register: cis_level1_aa_complain

- name: AppArmor | Enforce them
  ansible.builtin.command: "aa-enforce {{ item }}"
  loop: "{{ cis_level1_aa_complain.stdout_lines }}"
  changed_when: true

- name: AppArmor | Read loaded profile modes
  ansible.builtin.command: aa-status --json
  changed_when: false
  check_mode: false
  register: cis_level1_aa_status

- name: AppArmor | Assert no loaded profile is in complain mode
  vars:
    _profiles: "{{ (cis_level1_aa_status.stdout | from_json).profiles | dict2items }}"
    _complain: "{{ _profiles | selectattr('value', 'equalto', 'complain') | map(attribute='key') | list }}"
  ansible.builtin.assert:
    that: _complain | length == 0
    fail_msg: "Profiles still in complain mode: {{ _complain }}"
    quiet: true
  when: not ansible_check_mode
