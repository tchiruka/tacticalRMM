---
# =============================================================================
# CIS Ubuntu Linux 26.04 LTS Benchmark v1.0.0 - Level 1 Server
# Implementation: ansible-lockdown/UBUNTU26-CIS 0.9.0
#                 commit 9746233c6b14dd94758fc11e39e51ce6f5af24b7
#
# These are role VARS (not defaults) on purpose: role vars of this wrapper
# override the vendor role's defaults (verified), so nothing below silently
# falls back to an upstream default. Operator choices are exposed through the
# inventory toggles referenced here (siem_*, cis_*, vault_grub_password_hash).
#
# EVERY control is listed explicitly further down with its level, title and,
# where it differs from "Level 1 on / Level 2 off", the reason.
# Exceptions (EXC-xx) are in docs/cis-exceptions.md.
# Control IDs/titles were taken from the role's task names; cross-check them
# against the benchmark PDF from CIS WorkBench before the CAB.
# =============================================================================

# --- Scope ---------------------------------------------------------------------
ubtu26cis_section1: true
ubtu26cis_section2: true
ubtu26cis_section3: true
# Section 4 stays enabled for its supporting ufw/sysctl tasks; the 4.1.x
# controls themselves are disabled below and implemented by trmm_firewall.
ubtu26cis_section4: true
ubtu26cis_section5: true
ubtu26cis_section6: true
ubtu26cis_section7: true
# Level flags only drive the role's audit/compliance facts; the per-rule
# toggles below decide what is remediated.
ubtu26cis_level_1: true
ubtu26cis_level_2: false
os_check: true
ubtu26cis_disruption_high: true
# The vendor "PRELIM | Run apt update" otherwise reports changed on every run
# (changed_when: not <this>), which would break the idempotence gate.
ubtu26cis_ignore_apt_update_changed_when: true
# The wrapper reboots under its own control (cis_level1_reboot_allowed).
skip_reboot: true

# --- Platform specifics verified on Ubuntu 26.04 ---------------------------
# sudo-rs is the default sudo; it rejects `Defaults logfile` (verified with
# visudo), so CIS 5.2.3 uses the role's rsyslog method, which needs rsyslog.
ubtu26cis_sudo_package: "{{ cis_level1_sudo_package | default('sudo-rs') }}"
ubtu26cis_syslog_service: rsyslog
ubtu26cis_sudo_logfile: /var/log/sudo.log
ubtu26cis_sudo_timestamp_timeout: 15
# chrony is the default time daemon; sources are owned by role baseline.
ubtu26cis_time_sync_tool: chrony
ubtu26cis_time_pool: []
ubtu26cis_time_servers: []
# /tmp is a systemd tmp.mount tmpfs on 26.04; the fstab method skips tmpfs,
# so options (incl. noexec, CIS 1.1.2.1.4) are applied via the unit.
ubtu26cis_tmp_svc: true
ubtu26cis_tmp_partition_mount_options:
  - mode=1777
  - strictatime
  - nosuid
  - nodev
  - noexec
# IPv6 stays enabled: nginx listens on [::]:443 (CIS 3.1.1 = identified).
ubtu26cis_ipv6_required: true
ubtu26cis_desktop_required: false

# --- Services Tactical RMM needs ------------------------------------------------
# nginx is the TRMM reverse proxy (approved web server, EXC-01, CIS 2.1.19).
ubtu26cis_nginx_server: true
ubtu26cis_nginx_mask: false

# --- AppArmor -------------------------------------------------------------------
ubtu26cis_apparmor_disable: false
ubtu26cis_apparmor_mode: enforce

# --- Bootloader (CIS 1.4.1) -----------------------------------------------------
ubtu26cis_set_boot_pass: "{{ cis_grub_password_enabled | bool }}"
ubtu26cis_bootloader_password_hash: "{{ vault_grub_password_hash | default('grub.pbkdf2.sha512.changethispassword') }}"
# Normal boots stay unattended; only menu edits / GRUB shell need the password.
ubtu26cis_ask_passwd_to_boot: false

# --- Banners ----------------------------------------------------------------------
ubtu26cis_warning_banner: |
  Authorised users only. All activity on this system is monitored and logged.
  Unauthorised access is prohibited and may be prosecuted.

# --- SSH (shared with role baseline) ---------------------------------------------
ubtu26cis_sshd_ciphers: "{{ ssh_ciphers }}"
ubtu26cis_sshd_macs: "{{ ssh_macs }}"
ubtu26cis_sshd_kex_algorithms: "{{ ssh_kex_algorithms }}"
ubtu26cis_sshd_allow_groups: "{{ baseline_ssh_allow_group }}"
ubtu26cis_sshd_log_level: INFO
ubtu26cis_sshd_max_auth_tries: 4
ubtu26cis_sshd_max_sessions: 8
ubtu26cis_sshd_login_grace_time: 60
ubtu26cis_sshd_client_alive_interval: 15
ubtu26cis_sshd_client_alive_count_max: 3

# --- Accounts and PAM ---------------------------------------------------------------
ubtu26cis_pass_max_days: 365
ubtu26cis_pass_min_days: 1
ubtu26cis_pass_warn_age: 7
ubtu26cis_pass_inactive: 45
ubtu26cis_passwd_hash_algo: yescrypt
ubtu26cis_passwd_minlen_value: 14
ubtu26cis_faillock_deny: 5
# PCI-DSS v4.0 8.3.4: lock-out of at least 30 minutes (CIS allows 0 or >= 900).
ubtu26cis_faillock_unlock_time: 1800
ubtu26cis_shell_session_timeout: 900
ubtu26cis_bash_umask: '027'
ubtu26cis_root_umask: '0027'
ubtu26cis_cron_allow_users: []

# --- Logging ----------------------------------------------------------------------
ubtu26cis_remote_log_server: "{{ siem_host | default('') }}"
ubtu26cis_remote_log_port: "{{ siem_port | default(514) }}"
ubtu26cis_remote_log_protocol: "{{ siem_protocol | default('tcp') }}"
ubtu26cis_system_is_log_server: false

# --- auditd (Level 2 controls adopted, see rules below) ------------------------------
ubtu26cis_auditd_back_log_limit: 8192
ubtu26cis_max_log_file_size: 32
ubtu26cis_auditd_max_log_file_action: keep_logs

# --- AIDE ---------------------------------------------------------------------------
ubtu26cis_config_aide: true
# The first database build can take a while on a populated host.
ubtu26cis_aide_init_async: 3600
ubtu26cis_aide_scan: timer

# --- File system sweeps ---------------------------------------------------------------
ubtu26cis_no_world_write_adjust: true
ubtu26cis_ownership_adjust: true
# SUID/SGID files are reported for review, never changed automatically.
ubtu26cis_suid_sgid_adjust: false

# --- ufw / sysctl coordination ------------------------------------------------------------
ubtu26cis_ufw_use_sysctl: true

# --- Role audit content (used only by playbooks/audit.yml) ---------------------------------
audit_git_version: 30675914e43b3d3821094c5f675d1baa993dc061
audit_log_dir: /var/log/cis-audit
audit_conf_dest: /var/lib/cis-audit

