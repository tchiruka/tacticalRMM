---
- name: Restart ssh
  ansible.builtin.systemd_service:
    name: ssh.service
    state: restarted

- name: Restart chrony
  ansible.builtin.systemd_service:
    name: chrony.service
    state: restarted

- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald.service
    state: restarted
