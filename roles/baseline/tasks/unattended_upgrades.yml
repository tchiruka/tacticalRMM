---
# Security pocket only. Third-party repositories added by the TRMM installer
# (nginx.org, NodeSource, PGDG) are deliberately NOT auto-upgraded: those
# versions are managed by TRMM's update.sh / planned maintenance.
- name: Patching | Enable periodic unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      // Managed by Ansible (role baseline)
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    owner: root
    group: root
    mode: "0644"

- name: Patching | Unattended-upgrades policy
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-trmm
    content: |
      // Managed by Ansible (role baseline)
      Unattended-Upgrade::Allowed-Origins {
        "${distro_id}:${distro_codename}-security";
        "${distro_id}ESMApps:${distro_codename}-apps-security";
        "${distro_id}ESM:${distro_codename}-infra-security";
      };
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      // Reboots are planned (kernel updates are applied in a maintenance window).
      Unattended-Upgrade::Automatic-Reboot "false";
      Unattended-Upgrade::SyslogEnable "true";
    owner: root
    group: root
    mode: "0644"

- name: Patching | unattended-upgrades service enabled
  ansible.builtin.systemd_service:
    name: unattended-upgrades.service
    enabled: true
    state: started
