---
- name: Packages | Refresh apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  # Refreshing package lists is not a configuration change (idempotence gate).
  changed_when: false

- name: Packages | Install baseline packages
  ansible.builtin.apt:
    name: "{{ baseline_packages }}"
    state: present
