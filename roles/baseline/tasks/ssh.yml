---
# Key-only SSH for members of the login group. The CIS role later adds
# /etc/ssh/sshd_config.d/00-cis-sshd.conf (crypto, timeouts, banner, ...);
# sshd uses the first value it reads, and both files set identical values
# for the few overlapping keywords.

- name: SSH | Baseline sshd drop-in
  ansible.builtin.template:
    src: sshd-10-baseline.conf.j2
    dest: /etc/ssh/sshd_config.d/10-baseline.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: SSH | Validate the complete effective configuration
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
  check_mode: false
