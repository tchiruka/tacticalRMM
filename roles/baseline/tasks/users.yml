---
# In --check mode nothing is created, so tasks that need a group/user created
# earlier in this run are skipped instead of failing (real runs: always run).
- name: Users | Read existing groups and users (read-only)
  ansible.builtin.getent:
    database: "{{ item }}"
  loop: [group, passwd]
  check_mode: false

- name: Users | SSH login group
  ansible.builtin.group:
    name: "{{ baseline_ssh_allow_group }}"
    system: true
    state: present

- name: Users | Administrators
  ansible.builtin.user:
    name: "{{ item.name }}"
    comment: "{{ item.comment | default(omit) }}"
    shell: /bin/bash
    groups: [sudo, "{{ baseline_ssh_allow_group }}"]
    append: true
    password: "{{ item.password_hash }}"
    update_password: always
    password_expire_max: "{{ baseline_password_max_days }}"
    password_expire_min: "{{ baseline_password_min_days }}"
    password_expire_warn: "{{ baseline_password_warn_days }}"
  loop: "{{ admin_users }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  when: not ansible_check_mode or baseline_ssh_allow_group in ansible_facts['getent_group']

- name: Users | Authorised SSH keys (exclusive)
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    key: "{{ item.ssh_keys | join('\n') }}"
    exclusive: true
    state: present
  loop: "{{ admin_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: not ansible_check_mode or item.name in ansible_facts['getent_passwd']
