---
# Tactical RMM does not support in-place OS upgrades ("In-place OS upgrades
# are NOT supported, you must do a backup/restore" – v1.6.0 release notes).
# Block both the prompt and the tool; see docs/runbook.md "OS migration".

- name: Release upgrades | Never prompt for a new release
  ansible.builtin.lineinfile:
    path: /etc/update-manager/release-upgrades
    regexp: '^Prompt='
    line: Prompt=never
    create: true
    owner: root
    group: root
    mode: "0644"

- name: Release upgrades | Divert do-release-upgrade away (survives package updates)
  community.general.dpkg_divert:
    path: /usr/bin/do-release-upgrade
    divert: /usr/bin/do-release-upgrade.disabled-by-trmm
    rename: true
    state: present

- name: Release upgrades | Install refusal stub
  ansible.builtin.copy:
    dest: /usr/bin/do-release-upgrade
    content: |
      #!/bin/sh
      # Managed by Ansible (role baseline)
      echo "do-release-upgrade is disabled on this Tactical RMM server." >&2
      echo "In-place OS upgrades are not supported by TRMM. Migrate by" >&2
      echo "backup -> fresh VM -> restore (see docs/runbook.md)." >&2
      exit 1
    owner: root
    group: root
    mode: "0755"
