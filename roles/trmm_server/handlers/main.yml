---
- name: Reload rsyslogd AppArmor profile
  ansible.builtin.command: apparmor_parser -r /etc/apparmor.d/usr.sbin.rsyslogd
  changed_when: true

- name: Restart rsyslog
  ansible.builtin.systemd_service:
    name: rsyslog.service
    state: restarted

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
