---
# Static quality gates only: no secrets, no inventory, no connection to any
# real host. Actions are pinned by commit SHA.
name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout (full history for the secret scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Toolchain (pinned) and Galaxy content
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          .venv/bin/ansible-galaxy role install -r requirements.yml -p .galaxy/roles
          .venv/bin/ansible-galaxy collection install -r requirements.yml -p .galaxy/collections

      - name: gitleaks (checksum-verified binary)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          install -m 0755 gitleaks .venv/bin/gitleaks
          rm -f "${tarball}" checksums.txt gitleaks

      - name: Quality gates (yamllint, ansible-lint, shellcheck, syntax-check, gitleaks)
        run: scripts/lint.sh
